# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

on:
  - "pull_request"
  - "push"
  - "workflow_dispatch"

name: "CI"

jobs:
  tests:
    name: "Tests (PHP ${{ matrix.php-version }}, Guzzle ${{ matrix.guzzle-version }}, ${{ matrix.dependencies }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 5.6
          - 7.0
          - 7.1
          - 7.2
          - 7.3
          - 7.4
          - 8.0
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          - 8.6

        guzzle-version:
          - "^6.3"
          - "^7.0"
          - "^8.0"

        dependencies:
          - lowest
          - highest

        # Guzzle 7 requires PHP >= 7.2.5, Guzzle 8 requires PHP >= 7.4
        exclude:
          - { guzzle-version: "^7.0", php-version: 5.6 }
          - { guzzle-version: "^7.0", php-version: 7.0 }
          - { guzzle-version: "^7.0", php-version: 7.1 }
          - { guzzle-version: "^8.0", php-version: 5.6 }
          - { guzzle-version: "^8.0", php-version: 7.0 }
          - { guzzle-version: "^8.0", php-version: 7.1 }
          - { guzzle-version: "^8.0", php-version: 7.2 }
          - { guzzle-version: "^8.0", php-version: 7.3 }

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: Run PHP Lint
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          coverage: xdebug
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: actions/cache@v5
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "php-${{ matrix.php-version }}-guzzle-${{ matrix.guzzle-version }}-${{ matrix.dependencies }}"
          restore-keys: "php-${{ matrix.php-version }}-guzzle-${{ matrix.guzzle-version }}-${{ matrix.dependencies }}"

      # Older Guzzle releases have security advisories and Composer >= 2.9 refuses to install them.
      # Composer 2.2 (installed for PHP < 7.2.5) neither blocks advisories nor knows this setting.
      - name: "Allow Guzzle releases with security advisories"
        if: ${{ matrix.php-version >= 7.2 }}
        run: 'composer config --json policy.advisories.ignore ''["guzzlehttp/guzzle", "guzzlehttp/psr7", "guzzlehttp/promises"]'''

      - name: "Pin Guzzle major version"
        run: 'composer require --no-update --no-interaction "guzzlehttp/guzzle:${{ matrix.guzzle-version }}"'

      - name: "Install ${{ matrix.dependencies }} dependencies"
        run: "composer update --no-interaction --no-progress --no-suggest ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}"

      - name: "Tests"
        run: "vendor/bin/phpunit"
